services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gamerhub
      POSTGRES_USER: gamerhub
      POSTGRES_PASSWORD: gamerhub_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores data in a major-version subdirectory so upgrades
      # can use pg_upgrade without crossing a mount boundary.
      - gamerhub-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamerhub -d gamerhub"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gamerhub_local
      MINIO_ROOT_PASSWORD: gamerhub_local_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - gamerhub-object-storage:/data
  otel:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  gamerhub-postgres:
  gamerhub-object-storage:
